<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="TND Guides home"><img class="logo-img" src="img/logo.svg" alt="" width="36" height="36"><span class="brand"><b>TND</b> Guides</span></a>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="index.html#mine">My lessons</a>
      <a href="teachers.html">Teachers</a>
      <a href="forum.html" class="on">Ask the class</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="tag">Forum</span>
    <h1>Ask the <span>class</span>.</h1>
    <p>Post a school question. Other students can answer. Be kind, and never post your phone number.</p>
  </div>
</section>

<main class="wrap stack">
  <button class="btn yellow big block" id="open-ask">Ask a question</button>

  <div class="card stack" id="ask-box" hidden>
    <h3 style="margin:0">Ask a question</h3>
    <label class="field" for="q-name">Your first name<input id="q-name" maxlength="30"></label>
    <div class="form-row">
      <label class="field" for="q-grade">Grade<select id="q-grade"></select></label>
      <label class="field" for="q-subject">Subject<select id="q-subject"></select></label>
    </div>
    <label class="field" for="q-title">Your question<input id="q-title" maxlength="140" placeholder="e.g. What is photosynthesis?"></label>
    <label class="field" for="q-text">More details <span class="hint">(optional)</span><textarea id="q-text" maxlength="600"></textarea></label>
    <div id="ask-error"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn yellow" id="post">Post question</button><button class="btn" id="cancel">Cancel</button></div>
  </div>

  <div>
    <h2 style="margin:6px 0 8px">Questions</h2>
    <div class="chips" id="filter"></div>
  </div>
  <div id="list" class="stack"></div>
</main>

<footer><div class="wrap">Need a private teacher? Choose your grade on the <a href="index.html">home page</a>. The admin will arrange it.</div></footer>

<script type="module" src="js/forum.js?v=8"></script>
</body>
</html>
